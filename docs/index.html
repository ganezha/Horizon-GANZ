<!doctype html>
<html lang="id">
<head>

  <style>
/* Warna dasar. Ubah --mint untuk mengganti aksen utama seluruh situs. */
:root {
  color-scheme: dark;
  --bg: #090d10;
  --panel: #10171b;
  --line: #283237;
  --ink: #f0f5f4;
  --soft: #adbab9;
  --mint: #90f2d3;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --width: 1192px;
  font: 100%/1.55 Inter, "Segoe UI", system-ui, sans-serif;
  color: var(--ink);
  background: var(--bg);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
button { color: inherit; font: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 4px; }
#utama:focus { outline: none; }
::selection { color: #051813; background: var(--mint); }
.wrap { width: min(var(--width), calc(100% - clamp(32px, 9vw, 144px))); margin-inline: auto; }
main { padding-bottom: 64px; }
h1, h2, h3, p, figure { margin: 0; }
h1, h2, h3 { font-weight: 670; line-height: 1.12; }
h1 { font-size: clamp(2.15rem, 5vw, 4.3rem); letter-spacing: -.055em; }
h2 { font-size: clamp(1.5rem, 2.6vw, 2.05rem); letter-spacing: -.045em; }
.skip { position: absolute; top: -100px; left: 12px; z-index: 12; padding: 10px; background: var(--panel); }
.skip:focus { top: 12px; }

/* Kepala halaman. Logo dan menu memakai tautan yang dapat dibuka dengan papan ketik. */
.mast { border-bottom: 1px solid var(--line); }
.mast-inner, .brand, .top-nav, .nav-archive, .actions, .primary, .replay-link, .trending-link {
  display: flex; align-items: center;
}
.mast-inner { min-height: 74px; justify-content: space-between; }
.brand { gap: 12px; font-weight: 770; letter-spacing: .055em; font-size: 1.04rem; }
.brand b { color: var(--mint); }
.brand-mark {
  width: 31px; height: 31px; position: relative; display: grid; place-items: center;
  background: #152923; border: 1px solid #427164; border-radius: 9px; overflow: hidden;
}
.brand-mark::before, .brand-mark::after, .brand-mark i {
  content: ""; position: absolute; width: 21px; height: 9px; border: 1.5px solid var(--mint);
  border-radius: 50%; transform: rotate(-34deg);
}
.brand-mark::after { transform: rotate(32deg); }
.brand-mark i { width: 5px; height: 5px; border: 0; background: var(--mint); }
.top-nav { gap: 24px; font-size: .9rem; font-weight: 550; }
.top-nav a { min-height: 44px; display: inline-flex; align-items: center; }
.nav-archive { gap: 9px; }
.top-nav a:hover, .back:hover, .trending-link:hover { color: var(--mint); }
.archive-icon { width: 14px; height: 14px; border: 1px solid #bdd0ca; border-radius: 3px; position: relative; }
.archive-icon::before, .archive-icon::after { content: ""; position: absolute; height: 1px; background: #bdd0ca; left: 3px; right: 3px; top: 4px; }
.archive-icon::after { top: 7px; right: 5px; }

.hero {
  display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
  align-items: center; gap: clamp(24px, 4vw, 64px);
  padding-block: clamp(32px, 5vw, 72px); border-bottom: 1px solid var(--line);
}
.eyebrow, .graph-top, .count, .role-label {
  font: 550 .77rem/1.4 var(--mono); letter-spacing: .075em;
}
.eyebrow { display: flex; align-items: center; gap: 10px; color: var(--mint); text-transform: uppercase; }
.signal-bars { width: 22px; height: 13px; transform: skew(-18deg); background: repeating-linear-gradient(90deg, var(--mint) 0 3px, transparent 3px 7px); }
.hero h1 { margin: 17px 0 19px; font-size: clamp(3.55rem, 6.9vw, 6.4rem); line-height: .94; letter-spacing: -.071em; }
.hero h1 em { font-style: normal; color: var(--mint); }
.edition-line { color: var(--soft); font-size: 1rem; }
.actions { flex-wrap: wrap; gap: 8px 20px; margin-top: 23px; }
.primary, .replay-link, .trending-link { min-height: 44px; gap: 9px; width: fit-content; }
.primary, .replay-link { border-radius: 9px; font-size: .91rem; font-weight: 640; padding: 10px 16px; }
.primary { background: var(--mint); color: #06271f; border: 1px solid #a0f7dc; box-shadow: inset 0 1px #e2fff845; }
.primary:hover { background: #b2ffe5; }
.trending-link { font-size: .88rem; font-weight: 570; color: #c4cfce; }

/* Papan jaringan. Node memakai tautan HTML, kanvas hanya untuk kabel dan pulsa. */
.graph {
  isolation: isolate; position: relative; width: 100%; overflow: hidden;
  border-radius: 20px; border: 1px solid #2d3f40; background-color: #0d1519;
  background-image: radial-gradient(ellipse at 50% 56%, #1b47404d, transparent 65%),
                    radial-gradient(#5b74734f .8px, transparent 1px);
  background-size: auto, 17px 17px;
  box-shadow: inset 0 1px 0 #ffffff07, 0 14px 40px -28px #000;
}
.graph::before, .graph::after {
  content: ""; position: absolute; width: 13px; height: 13px; pointer-events: none; opacity: .65;
}
.graph::before { left: 12px; bottom: 12px; border-left: 1px solid #6e9189; border-bottom: 1px solid #6e9189; }
.graph::after { right: 12px; bottom: 12px; border-right: 1px solid #6e9189; border-bottom: 1px solid #6e9189; }
.graph-top { padding: 5px 9px 0 18px; display: flex; align-items: center; justify-content: space-between; color: #b1c5c1; letter-spacing: .025em; }
.motion { display: grid; place-items: center; width: 44px; height: 44px; border: 0; background: transparent; }
.motion i { width: 10px; height: 12px; border-inline: 3px solid #a7c2bb; }
.motion[aria-pressed="true"] i { height: 0; width: 0; border: 0; border-left: 9px solid #a7c2bb; border-block: 6px solid transparent; }
.arena { position: relative; height: clamp(235px, 20vw, 292px); margin: 0 3% 10px; }
.arena canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hub, .satellite {
  position: absolute; z-index: 1; display: grid; place-items: center;
  transform: translate(-50%, -50%); touch-action: manipulation;
}
.hub { width: 100px; height: 78px; border-radius: 32px; }
.hub::before {
  content: ""; position: absolute; inset: -9px -4px; border-radius: 50%;
  background: radial-gradient(ellipse, #7bffe129, transparent 71%);
}
.hub-body { position: relative; width: 78px; height: 56px; display: grid; place-items: center; }
.helmet {
  z-index: 1; position: relative; width: 100%; height: 100%; padding: 7px 6px 9px;
  border-radius: 20px 20px 23px 23px; border: 1px solid #81aaa6;
  background: linear-gradient(156deg,#92ada9 -15%,#516567 20%,#2d3d43 49%,#18262d 73%,#334645);
  box-shadow: inset 0 2px 2px #e3fff35e, inset 0 -3px 4px #081315a6, 0 9px 13px #0007;
}
.visor {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 13px;
  border-radius: 13px 13px 16px 16px; background: linear-gradient(155deg,#193941,#0b191d 60%,#10272a);
  border: 1px solid #657f7d; box-shadow: inset 0 3px 7px #0008;
}
.visor i {
  width: 12px; height: 11px; border-radius: 5px; background: #a1ffde;
  box-shadow: 0 0 8px #68fddcaa, 0 0 17px #3de9c278;
}
.vents { position: absolute; bottom: 3px; left: 42%; width: 17%; height: 2px; background: repeating-linear-gradient(90deg,#91b6ac 0 1px,transparent 1px 3px); }
.antenna { position: absolute; bottom: 96%; width: 3px; height: 9px; background: #71978d; transform: rotate(8deg); }
.antenna::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #a2f9db; position: absolute; top: -3px; left: -2px; box-shadow: 0 0 9px #95ffe299; }
.ear { position: absolute; background: linear-gradient(#748f90,#283a40); border: 1px solid #698882; width: 8px; height: 22px; border-radius: 5px; top: 18px; }
.ear.left { left: -5px; }
.ear.right { right: -5px; }
.satellite { width: 80px; height: 48px; align-content: center; gap: 3px; color: var(--tint); border-radius: 12px; }
.gem {
  width: 16px; height: 16px; border-radius: 6px; transform: rotate(45deg);
  border: 1px solid var(--tint);
  background: radial-gradient(circle at 28% 23%,#fff 0%,var(--tint) 21%,#152c34 78%);
  box-shadow: 0 0 0 4px color-mix(in srgb,var(--tint) 10%,transparent), 0 0 16px color-mix(in srgb,var(--tint) 25%,transparent);
}
.satellite-label { font: 550 .77rem/1.3 var(--mono); padding: 2px 5px; background: #0c161be8; border-radius: 4px; }
.satellite:is(:hover,:focus-visible,.lit) .gem { outline: 1px solid var(--tint); outline-offset: 4px; }

/* Enam simpul tetap tersusun dalam kisi, termasuk pada layar kecil. */
.team-section, .archive-section { padding-block: clamp(24px, 3.2vw, 42px); }
.team-section { border-bottom: 1px solid var(--line); }
.section-head, .archive-row, .between { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.section-head { margin-bottom: 18px; }
.team-note { color: var(--soft); margin-top: 6px; font-size: .94rem; }
.replay-link, .control {
  background: #11191d; color: #dfebe8; border: 1px solid #344346;
}
.replay-link:hover, .control:hover { background: #19262a; border-color: #647f79; }
.replay-link { flex-shrink: 0; }
.replay-link > span { font-size: 1.25rem; line-height: 1; color: var(--mint); }
.role-strip { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 12px; }
.role-strip::before { content: ""; position: absolute; left: 5%; right: 5%; top: 50%; height: 1px; background: #465756; }
.role-card {
  position: relative; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center;
  padding: 15px 12px; border-radius: 12px; border: 1px solid #2a363a;
  background: linear-gradient(130deg, color-mix(in srgb,var(--tint) 6%,#101619),#101619 80%);
}
.role-card:hover, .role-card:focus-visible { border-color: var(--tint); }
.mini-bot {
  display: inline-flex; flex-shrink: 0; position: relative; align-items: center; justify-content: center; gap: 3px;
  width: 28px; height: 23px; border-radius: 8px; color: var(--tint);
  border: 1.5px solid currentColor; background: color-mix(in srgb,var(--tint) 9%,#101619);
}
.mini-bot::before { content:""; position:absolute; bottom:100%; left:48%; width:2px; height:4px; background:currentColor; }
.mini-bot i { width: 4px; height: 5px; background: currentColor; border-radius: 2px; }
.role-card strong, .role-card small { display: block; }
.role-card strong { font-size: .96rem; letter-spacing: -.025em; }
.role-card small { color: #a6b5b2; font-size: .78rem; margin-top: 2px; }
.count { color: var(--soft); text-transform: uppercase; }
.archive-list { border: 1px solid var(--line); border-radius: 14px; background: #0e1418; overflow: hidden; }
.archive-row { min-height: 59px; padding: 11px 20px; }
.archive-row + .archive-row { border-top: 1px solid #253035; }
.archive-row:hover { background: #172125; }
.archive-row:focus-visible { outline-offset: -3px; }
.row-date, .row-language { display: inline-flex; gap: 12px; align-items: center; }
.row-date time { font-weight: 560; letter-spacing: -.015em; }
.date-icon {
  position: relative; width: 16px; height: 16px; border: 1px solid #7f9892; border-radius: 4px;
  background: linear-gradient(transparent 4px,#7f9892 4px 5px,transparent 5px);
}
.date-icon::before { content: ""; position:absolute; left:3px; right:3px; height:4px; top:-3px; border-inline:1px solid #7f9892; }
.row-language { color: #b0c4be; font-size: .86rem; }
.row-arrow { color: var(--mint); font-size: 1.05rem; }
.more-link, .back { display: inline-flex; min-height: 44px; align-items: center; gap: 7px; color: var(--soft); }
.more-link { margin-top: 8px; }
.page-head { padding: 24px 0 20px; }
.page-head .back { margin-bottom: 12px; }
.page-head .eyebrow { margin-bottom: 9px; }
.page-lead { max-width: 61ch; color: var(--soft); margin-top: 12px; }
.detail-grid { display: grid; grid-template-columns: minmax(0,.9fr) minmax(0,1.1fr); align-items: start; gap: 24px; margin-top: 18px; }
.detail-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 15px; padding: clamp(17px,2.6vw,32px); }
.detail-panel h2 { font-size: 1.5rem; }
.detail-panel p, .step-text { margin: 10px 0 16px; color: var(--soft); }
.detail-panel a:not(.primary):not(.role-card), .reader a { color: var(--mint); text-decoration: underline; text-underline-offset: .2em; }
.metric { border-top: 1px solid var(--line); padding-top: 14px; font-weight: 550; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.control { padding: 8px 13px; border-radius: 8px; min-height: 44px; }
.step-list { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 16px 0 0; }
.step-list li { font-size: .8rem; padding: 4px 8px; border-radius: 6px; border: 1px solid #344247; color: var(--soft); }
.step-list li[aria-current="step"] { border-color: var(--tint); color: var(--tint); }
.reader { max-width: 78ch; margin: 0 auto 32px; overflow-wrap: anywhere; }
.story { color: #d5e0dd; font-size: 1.045rem; line-height: 1.72; }
.story h2, .story h3 { margin: 1.6em 0 .65em; line-height: 1.27; color: var(--ink); }
.story h2 { font-size: 1.65rem; }
.story h3 { font-size: 1.25rem; }
.story :is(p,ul,ol,details,pre) { margin-block: .95em; }
.story hr { border: 0; border-top: 1px solid var(--line); margin: 1.75em 0; }
.story blockquote { margin: 1em 0; padding: 8px 18px; background: #13211f; border-left: 3px solid #74d3b5; }
.story blockquote p { margin: .35em 0; }
.story code { background: #1a2528; padding: .05em .25em; border-radius: 4px; }
.story pre { max-width: 100%; overflow: auto; }
.story img { max-width: 100%; height: auto; }
.story details summary { cursor: pointer; color: var(--mint); }
.story [id] { scroll-margin-top: 20px; }
.topic-nav { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin: 0 0 22px; }
.topic-nav strong { width: 100%; font-size: .95rem; }
.topic-nav a { padding: 9px 13px; border-radius: 10px; border: 1px solid var(--line); color: var(--mint); display:inline-flex; align-items:center; min-height:44px; text-decoration:none; }
.fallback { padding-block: 32px; }
.fallback-link { display: block; color: var(--mint); text-decoration: underline; padding: 6px; }

@media (max-width: 1040px) {
  .role-strip { grid-template-columns: repeat(3,minmax(0,1fr)); }
  .role-strip::before { display: none; }
}
@media (max-width: 760px) {
  .mast-inner { min-height: 62px; }
  .hero { grid-template-columns: 1fr; gap: 24px; }
  .hero h1 { font-size: clamp(3.65rem,12.5vw,5.6rem); }
  .arena { height: clamp(216px,52vw,280px); }
  .graph-top { padding-top: 0; }
  .detail-grid { grid-template-columns: 1fr; }
  .team-section .section-head { flex-wrap: wrap; }
}
@media (max-width: 540px) {
  .brand { font-size: .87rem; gap: 8px; }
  .brand-mark { width: 27px; height: 27px; }
  .top-nav { font-size: .84rem; gap: 12px; }
  .role-strip { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
  .role-card { padding: 12px; }
  .archive-row { padding: 11px 12px; gap: 8px; }
  .row-date { gap: 8px; font-size: .91rem; }
  .row-language { gap: 5px; font-size: .79rem; }
  .actions { column-gap: 16px; }
}
@media (max-width: 360px) {
  .top-nav { gap: 8px; }
  .archive-icon, .date-icon { display: none; }
  .row-date { font-size: .84rem; }
  .hub-body { transform: scale(.83); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
}

</style>

<h3 id="postgresql-19-tambahkan-wait-for-lsn-untuk-pembacaan-di-server-siaga-️-9010"><a href="https://simonwillison.net/2026/Nov/19/postgresql-19/">PostgreSQL 19 Tambahkan WAIT FOR LSN untuk Pembacaan di Server Siaga</a> ⭐️ 9.0/10</h3>

<p>PostgreSQL 19 telah dirilis dengan perintah baru untuk aplikasi yang menulis ke basis data utama dan membaca dari server siaga. Sebelum menjalankan kueri, sesi di server siaga dapat menggunakan WAIT FOR LSN untuk menunggu hingga server tersebut menerapkan ulang log tulis di muka sampai ke nomor urut log yang ditentukan. Dengan begitu, kueri dapat melihat hasil penulisan yang sebelumnya dilakukan aplikasi. Jika batas waktu opsional terlampaui sebelum server siaga menyusul, perintah tersebut mengembalikan pesan kesalahan.</p>

<p>rss · Simon Willison · Nov 19, 20:43</p>

<p><strong>「Mengapa pembacaan dari replika bisa tertinggal」</strong> Server siaga PostgreSQL menerapkan ulang log tulis di muka (WAL) dari server utama. Karena itu, pembacaan dari server siaga bisa belum melihat hasil penulisan yang transaksinya sudah dikomit di server utama. Nomor urut log (LSN) menandai posisi dalam log tersebut dan memberi server siaga titik yang harus dicapai sebelum melayani permintaan baca. MediaWiki menggunakan pola serupa dengan MySQL: posisi replikasi server utama disimpan dalam sesi pengguna, lalu MediaWiki menunggu replika mencapai posisi itu sebelum membaca darinya.</p>

<p><strong>「Dampak」</strong> Untuk menjaga konsistensi baca-setelah-tulis antarpermintaan, aplikasi perlu menyimpan posisi log server utama setelah menulis, lalu meneruskannya ke sesi di server siaga sebelum membaca. Aplikasi yang menetapkan batas waktu juga perlu menangani kesalahan ketika server siaga tertinggal terlalu jauh.</p>

<p><strong>Tag</strong>: <code>#PostgreSQL</code>, <code>#replikasi basis data</code>, <code>#konsistensi baca-setelah-tulis</code>, <code>#pencatatan log tulis di muka</code></p>

<p><strong>「Apa yang diverifikasi Lean」</strong> Kernel Lean memeriksa apakah suatu bukti benar-benar membuktikan pernyataan formal yang diberikan, dengan menggunakan aksioma yang dipakai dalam bukti tersebut. Kesesuaian hasil dari kernel-kernel independen mengurangi kekhawatiran akan adanya galat pada pemeriksa bukti, tetapi tidak memastikan bahwa pernyataan formal itu mewakili konjektur yang dimaksud. Untuk memastikannya, definisi dan asumsi perlu ditinjau secara terpisah.</p>

<p><strong>「Apa yang dipastikan oleh verifikasi Lean」</strong> Sebelum menganggap pemeriksaan Lean yang berhasil sebagai bukti bahwa suatu konjektur telah dibuktikan, penelaah perlu membandingkan pernyataan formal beserta asumsi-asumsinya dengan konjektur asli. Sekalipun kernel-kernel independen memberikan hasil yang sama, yang diperiksa adalah bukti atas pernyataan sebagaimana ditulis, bukan apakah pernyataan itu mewakili klaim matematis yang dimaksud.</p>

<p><strong>「Apa yang dapat diverifikasi Lean」</strong> Seorang komentator melaporkan bahwa dua kernel Lean yang independen tampaknya menerima suatu bukti. Menurutnya, hal ini memperkecil kemungkinan adanya bug pada kernel. Komentator lain mengajukan pertanyaan berbeda: sekalipun kedua kernel menerima bukti tersebut, apakah pernyataan formalnya benar-benar sesuai dengan konjektur yang dimaksud?</p>

<h3 id="makalah-arxiv-melaporkan-model-bahasa-mengubah-bobotnya-sendiri-tanpa-gradien-️-7010"><a href="https://arxiv.org/abs/2611.21885">Makalah ArXiv Melaporkan Model Bahasa Mengubah Bobotnya Sendiri Tanpa Gradien</a> ⭐️ 7.0/10</h3>

<p>Sebuah makalah di arXiv melaporkan bahwa sebuah model bahasa mengubah bobotnya sendiri tanpa menggunakan gradien dan mempertahankan perubahan yang meningkatkan akurasinya dalam mengerjakan soal latihan. Diskusi itu menyebut bahwa akurasi meningkat karena jejak penalaran yang lebih pendek tidak melampaui batas token. Informasi yang tersedia tidak menunjukkan bahwa perubahan itu meningkatkan kemampuan penalaran model secara lebih luas.</p>

<p><strong>「Perubahan bobot dibandingkan pemberian prompt」</strong> Bobot model adalah parameter numerik yang memengaruhi keluarannya. Prompt mengubah masukan tanpa mengubah parameter tersebut, sedangkan perubahan bobot tetap berlaku untuk permintaan berikutnya. Makalah itu menjelaskan bahwa metodenya tidak menggunakan gradien: model menguji usulan perubahan pada soal latihan dan mempertahankan perubahan yang berhasil, alih-alih menggunakan gradien untuk menentukan cara memperbarui bobotnya.</p>

<p><strong>「Implikasi bagi evaluasi」</strong> Kenaikan akurasi yang dilaporkan tidak membuktikan bahwa model bernalar lebih baik. Seorang komentator menunjuk lampiran makalah sebagai bukti bahwa perubahan bobot mengatasi kegagalan akibat terlampauinya batas token. Untuk membedakan peningkatan kemampuan penalaran dari sekadar berkurangnya keluaran yang terpotong, evaluator sebaiknya melaporkan persentase keluaran yang terpotong bersama angka akurasi, lalu memeriksa apakah peningkatan akurasi itu bertahan ketika jatah token diperbesar.</p>

<p><strong>「Diskusi Komunitas」</strong> Seorang komentator berpendapat bahwa penyuntingan itu meningkatkan skor hanya karena mencegah jawaban terpotong. Komentator lain mempertanyakan klaim “tanpa pelatihan” dalam makalah tersebut. Menurutnya, menguji berbagai usulan perubahan pada soal latihan dan mempertahankan perubahan yang berhasil dapat dianggap sebagai pelatihan meskipun tidak menggunakan penurunan gradien.</p>

<p>Dalam pengumuman singkat, Levent Alpöge mengatakan bahwa ia dan Claude menemukan bukti Hipotesis Riemann dan memperluas metode tersebut untuk membuktikan Hipotesis Riemann yang Digeneralisasi. Ia mengatakan bahwa mereka memformalkan argumen itu tanpa asumsi, tetapi materi yang disertakan tidak menunjukkan bahwa bukti tersebut telah diverifikasi secara independen. Ia memperkirakan metode itu juga dapat membuktikan Hipotesis Riemann yang Diperluas, tetapi tidak mengklaim telah membuktikannya.</p>

<p><strong>「Dugaan dan verifikasinya」</strong> Hipotesis Riemann menyatakan bahwa semua titik nol nontrivial fungsi zeta Riemann terletak pada garis dengan bagian real 1/2; Hipotesis Riemann yang Digeneralisasi memperluas klaim tersebut ke fungsi L Dirichlet. Formalisasi dalam Lean memungkinkan pemeriksa bukti memverifikasi pernyataan persis sebagaimana dituliskan dalam kode, tetapi penelaah tetap perlu memastikan bahwa pernyataan itu sesuai dengan dugaan yang dimaksud dan bahwa buktinya tidak menggunakan asumsi yang belum dibuktikan.</p>

<p>Sebuah pracetak yang dipublikasikan di repositori GitHub OpenAI mengklaim bahwa eksponen yang menentukan biaya aritmetika untuk mengalikan dua matriks persegi tepat 9/4 (2.25). Jika benar, hasil ini akan membantah dugaan bahwa eksponennya adalah 2. Materi yang tersedia tidak memastikan apakah pembuktiannya telah diverifikasi secara independen.</p>

<p>hackernews · E-Reverance · 25 Nov, 01:19 · <a href="https://news.ycombinator.com/item?id=50637220">Diskusi</a></p>

<p><strong>「Eksponen perkalian matriks」</strong> Eksponen perkalian matriks adalah infimum dari semua nilai pangkat α yang memungkinkan dua matriks n × n dikalikan dalam O(n^α) operasi aritmetika. Dugaan bahwa eksponennya adalah 2 memungkinkan waktu eksekusi O(n^(2+ε)) untuk setiap ε tetap dengan ε &gt; 0; dugaan ini tidak mensyaratkan algoritma dengan waktu eksekusi yang tepat kuadratik.</p>

<p><strong>「Batas bagi algoritma yang lebih cepat」</strong> Jika batas bawah dalam pracetak itu terbukti benar, tidak mungkin ada algoritma dalam model aritmetika yang memiliki eksponen perkalian matriks di bawah 2.25. Hal itu akan membantah dugaan bahwa eksponennya adalah 2, tetapi tidak menunjukkan algoritma mana yang paling cepat dalam praktik.</p>

<p><strong>「Diskusi komunitas」</strong> Para komentator di Hacker News menunjukkan bahwa batas atas 2.25 saja masih menyisakan kemungkinan bahwa eksponennya adalah 2. Menurut mereka, klaim utamanya adalah adanya batas bawah dengan nilai yang sama, yang akan menutup kemungkinan eksponen yang lebih kecil.</p>

<p><a id="item-tech-news-1"></a></p>
<h3 id="google-dilaporkan-akan-mewajibkan-penggunaan-server-mcp-miliknya-untuk-agen-workspace-server-mcp-gmail-tidak-bisa-mengirim-email-️-7010"><a href="https://techstackups.com/articles/google-workspace-ai-agents-mcp/">Google dilaporkan akan mewajibkan penggunaan server MCP miliknya untuk agen Workspace; server MCP Gmail tidak bisa mengirim email</a> ⭐️ 7.0/10</h3>

<p>TechStackUps melaporkan bahwa Google akan mewajibkan agen AI yang mengakses Workspace untuk menggunakan server Model Context Protocol (MCP) miliknya dan bahwa server MCP Gmail tidak mendukung pengiriman email. Keterbatasan itu berlaku untuk pengiriman lewat server MCP Gmail, bukan untuk semua cara agen mengirim email. Teks lengkap artikel tidak disertakan, sehingga belum jelas agen mana saja yang akan terkena kewajiban itu atau mengapa fitur kirim tidak tersedia.</p>

<script>
/* Horizon GANZ — navigasi, data edisi, dan jaringan bot. Bisa berjalan tanpa pustaka. */
(() => {
  'use strict';

  // Nama, posisi (0–1) dan warna node. Titik asal tiap bot selalu tetap, sehingga jalur tetap rapi.
  const roles = [
    { id: 'pemantau', name: 'Pemantau', color: '#77aaff', x: .18, y: .26, short: 'Cari sumber',
      task: 'Mengumpulkan judul, tautan, dan waktu terbit dari sumber berita yang dipantau.',
      next: ['penyaring'] },
    { id: 'penyaring', name: 'Penyaring', color: '#69e3ed', x: .50, y: .14, short: 'Pilah berita',
      task: 'Menggabungkan berita ganda sebelum analisis, lalu memilih berita untuk ditulis berdasarkan hasil penilaian.',
      next: ['analis', 'penulis'] },
    { id: 'analis', name: 'Analis', color: '#b499ff', x: .82, y: .26, short: 'Nilai isi',
      task: 'Membaca bahan sumber, menilai relevansi berita, dan menjelaskan mengapa topik itu penting.',

    { id: 'penulis', name: 'Penulis', color: '#f48cbd', x: .82, y: .73, short: 'Susun draf',
      task: 'Menyusun draf Bahasa Indonesia dari berita terpilih dan memperbaikinya jika Editor meminta revisi.',
      next: ['editor'] },
    { id: 'editor', name: 'Editor', color: '#87e899', x: .50, y: .85, short: 'Periksa fakta',
      task: 'Mencocokkan nama, angka, tanggal, dan klaim dengan bahan sumber. Draf bisa dikembalikan ke Penulis.',
      next: ['penulis', 'penerbit'] },
    { id: 'penerbit', name: 'Penerbit', color: '#f3ce75', x: .18, y: .73, short: 'Terbitkan edisi',
      task: 'Menyusun berita yang lolos pemeriksaan menjadi edisi harian dan menayangkannya di arsip.',
      next: [] }
  ];
  const byId = new Map(roles.map(role => [role.id, role]));
  const app = document.getElementById('utama');
  const dashboard = document.body.dataset.dashboard === 'yes';
  const offline = document.body.dataset.offline === 'yes';
  const home = dashboard ? '' : document.body.dataset.home;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  const dateFormat = new Intl.DateTimeFormat('id-ID', {
    day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC'
  });

  function dateLabel(date) {
    return dateFormat.format(new Date(date + 'T12:00:00Z'));
  }

  function template(id) {
    return document.getElementById(id).content.firstElementChild.cloneNode(true);
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function link(text, href, className) {
    const anchor = element('a', className, text);
    anchor.href = href;
    return anchor;
  }

  function route(path = '', date = '') {
    return home + '#/' + path + (date ? '/' + date : '');
  }

  function metricValue(value) {
    if (value === undefined || value.trim() === '') return null;
    const number = Number(value);
    return Number.isSafeInteger(number) && number >= 0 ? number : null;
  }

  // Satu kartu per tanggal. Utamakan edisi asli "-id" jika tanggal yang sama juga punya arsip terjemahan.
  function readEditions() {
    const perDay = new Map();
    for (const anchor of app.querySelectorAll('[data-edition-date]')) {
      const d = anchor.dataset;
      const date = d.editionDate;
      const priority = (d.lang === 'id' ? 2 : 0) + (anchor.pathname.endsWith('summary-id.html') ? 1 : 0);
      if (perDay.has(date) && perDay.get(date).priority >= priority) continue;
      const stats = {};
      for (const key of ['collected', 'unique', 'analyzed', 'selected', 'approved', 'revised']) {
        stats[key] = metricValue(d[key]);
      }
      perDay.set(date, { date, lang: d.lang, href: anchor.href, priority, stats, trending: d.trending === 'yes' });
    }
    return Array.from(perDay.values()).sort((a, b) => b.date.localeCompare(a.date));
  }

  const editions = readEditions();
  const latest = editions[0];
  function articleURL(edition, anchor = '') {
    if (offline) return route('edisi', edition.date) + (anchor ? '/' + encodeURIComponent(anchor) : '');
    return edition.href + (anchor ? '#' + encodeURIComponent(anchor) : '');
  }

  function numberNote(edition, key, sentence) {
    const value = edition?.stats[key];
    return value === null || value === undefined ? '' : sentence.replace('{n}', String(value));
  }

  function roleResult(role, edition) {
    switch (role.id) {
      case 'pemantau': return numberNote(edition, 'collected', '{n} berita terkumpul.');
      case 'penyaring': return [
        numberNote(edition, 'unique', '{n} berita unik.'),
        numberNote(edition, 'selected', '{n} berita dipilih untuk ditulis.')
      ].filter(Boolean).join(' ');
      case 'analis': return numberNote(edition, 'analyzed', '{n} berita melalui tahap analisis.');
      case 'penulis': return numberNote(edition, 'selected', '{n} berita terpilih masuk tahap penulisan.');
      case 'editor': return [
        numberNote(edition, 'approved', '{n} berita lolos pemeriksaan.'),
        numberNote(edition, 'revised', '{n} di antaranya lolos setelah revisi.')
      ].filter(Boolean).join(' ');
      case 'penerbit': return numberNote(edition, 'approved', '{n} berita masuk edisi ini.');
    }
  }

  function miniBot() {
    const bot = element('span', 'mini-bot');
    bot.setAttribute('aria-hidden', 'true');
    bot.append(element('i'), element('i'));
    return bot;
  }

  function roleCard(role, date) {
    const card = link('', route('bot/' + role.id, date), 'role-card');
    card.style.setProperty('--tint', role.color);
    card.title = role.task;
    const label = element('span');
    label.append(element('strong', '', role.name), element('small', '', role.short));
    card.append(miniBot(), label);
    return card;
  }

  function team(date) {
    const section = template('team-view');
    section.querySelector('.team-note').textContent = (date ? 'Edisi ' + dateLabel(date) + '. ' : '')
      + 'Sentuh bot untuk melihat tugasnya.';
    section.querySelector('.replay-link').href = route('proses', date);
    section.querySelector('.role-strip').append(...roles.map(role => roleCard(role, date)));
    return section;
  }

  function archive(items) {
    const section = template('archive-view');
    section.querySelector('.count').textContent = items.length + ' edisi';
    const list = section.querySelector('.archive-list');
    for (const edition of items) {
      const row = link('', articleURL(edition), 'archive-row');
      const left = element('span', 'row-date');
      const icon = element('span', 'date-icon');
      icon.setAttribute('aria-hidden', 'true');
      const time = element('time', '', dateLabel(edition.date));
      time.dateTime = edition.date;
      left.append(icon, time);
      const language = { id: 'Bahasa Indonesia', en: 'Bahasa Inggris', zh: 'Bahasa Mandarin' };
      const right = element('span', 'row-language', language[edition.lang] || edition.lang || 'Baca edisi');
      right.append(element('span', 'row-arrow', '→'));
      row.append(left, right);
      list.append(row);
    }
    if (!items.length) list.append(element('p', 'archive-row', 'Belum ada edisi terbit.'));
    return section;
  }

  function pageHead(title, eyebrow, lead = '') {
    const head = element('div', 'page-head');
    head.append(link('← Beranda', route(), 'back'));
    if (eyebrow) head.append(element('p', 'eyebrow', eyebrow));
    head.append(element('h1', '', title));
    if (lead) head.append(element('p', 'page-lead', lead));
    return head;
  }

  // Satu loop animasi untuk semua node. Saat ganti halaman, loop, timer, dan pengamat dilepas.
  let leavePage = [];
  function resetPage() {
    for (const clean of leavePage) clean();
    leavePage = [];
    app.replaceChildren();
  }

  const random = (low, high) => low + Math.random() * (high - low);
  let userPaused = reduced.matches;

  function network(mount, date, centerPath = 'redaksi', selectedRole = '') {
    const graph = template('graph-view');
    mount.append(graph);
    const arena = graph.querySelector('.arena');
    const canvas = graph.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const hub = graph.querySelector('.hub');
    const motion = graph.querySelector('.motion');
    hub.href = route(centerPath, date);
    if (centerPath === 'proses') {
      hub.title = 'Lihat urutan tugas redaksi';
      hub.setAttribute('aria-label', hub.title);
    }

    function point(node, x, y, color, id) {
      return { node, x, y, color, id, dx: 0, dy: 0, vx: 0, vy: 0, tx: 0, ty: 0,
        spring: 22, drag: 8, wake: 0, phase: Math.random(), speed: random(.12, .25),
        light: .6, targetLight: .8, px: 0, py: 0 };
    }
    const center = point(hub, .5, .49, '#9aefd3', 'pusat');
    const outer = roles.map(role => {
      const node = link('', route('bot/' + role.id, date), 'satellite');
      node.setAttribute('aria-label', role.name + ' — ' + role.short);
      node.title = role.task;
      node.style.setProperty('--tint', role.color);
      node.append(element('span', 'gem'), element('span', 'satellite-label', role.name));
      arena.append(node);
      return point(node, role.x, role.y, role.color, role.id);
    });
    const points = [center, ...outer];
    let width = 1, height = 1, ratio = 1, frame = 0, previous = 0;
    let visible = true, active = selectedRole;
    const abort = new AbortController();

    function position(p) {
      p.px = width * p.x + p.dx;
      p.py = height * p.y + p.dy;
      p.node.style.left = p.px + 'px';
      p.node.style.top = p.py + 'px';
    }

    function springStep(p, now, dt) {
      // Target acak tetap dekat titik asal agar label antarnode tidak bertabrakan.
      if (now >= p.wake) {
        const radius = p === center ? 2.8 : Math.min(9, width * .021);
        p.tx = random(-radius, radius);
        p.ty = random(-radius, radius);
        p.spring = random(16, 37);
        p.drag = random(5, 9);
        p.targetLight = random(.38, 1);
        p.wake = now + random(950, 3300);
      }
      // Jangan geser target yang sedang disentuh, diarahkan kursor, atau difokuskan.
      if (!p.node.matches(':hover, :focus-visible, :active')) {
        p.vx += ((p.tx - p.dx) * p.spring - p.drag * p.vx) * dt;
        p.vy += ((p.ty - p.dy) * p.spring - p.drag * p.vy) * dt;
        p.dx += p.vx * dt;
        p.dy += p.vy * dt;
      }
      p.light += (p.targetLight - p.light) * Math.min(1, dt * 2);
      p.phase = (p.phase + dt * p.speed) % 1;
    }

    function draw() {
      for (const p of points) position(p);
      if (!ctx) return;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, width, height);
      const cx = center.px, cy = center.py;
      ctx.lineWidth = 1;
      for (const scale of [.29, .41]) {
        ctx.beginPath();
        ctx.ellipse(width / 2, height / 2, width * scale, height * scale, 0, 0, Math.PI * 2);
        ctx.strokeStyle = '#29403e';
        ctx.globalAlpha = .65;
        ctx.stroke();
      }
      for (const p of outer) {
        const x = p.px, y = p.py - 7;
        const bx = (cx + x) / 2 + (y - cy) * .13;
        const by = (cy + y) / 2 - (x - cx) * .075;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.quadraticCurveTo(bx, by, x, y);
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = active === p.id ? .96 : .26 + .25 * p.light;
        ctx.lineWidth = active === p.id ? 2 : 1.15;
        ctx.stroke();
        // Piksel cahaya mengikuti kurva yang sama dengan kabel.
        const t = p.phase, u = 1 - t;
        ctx.beginPath();
        ctx.arc(u*u*cx + 2*u*t*bx + t*t*x, u*u*cy + 2*u*t*by + t*t*y,
          active === p.id ? 2.7 : 1.8, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = .35 + .65 * p.light;
        ctx.fill();
        p.node.firstElementChild.style.opacity = String(.69 + p.light * .31);
      }
      ctx.globalAlpha = 1;
    }

    function tick(now) {
      frame = 0;
      if (userPaused || !visible || document.hidden) return;
      if (!previous || now - previous >= 32) {
        const dt = previous ? Math.min((now - previous) / 1000, .045) : 0;
        previous = now;
        for (const p of points) springStep(p, now, dt);
        draw();
      }
      frame = requestAnimationFrame(tick);
    }

    function sync() {
      cancelAnimationFrame(frame);
      previous = 0;
      motion.setAttribute('aria-pressed', String(userPaused));
      motion.title = userPaused ? 'Aktifkan gerakan node' : 'Jeda gerakan node';
      motion.setAttribute('aria-label', motion.title);
      if (!userPaused && visible && !document.hidden) frame = requestAnimationFrame(tick);
    }

    function setActive(id) {
      active = id;
      for (const p of outer) p.node.classList.toggle('lit', p.id === id);
      draw();
    }

    function resize() {
      width = Math.max(1, arena.clientWidth);
      height = Math.max(1, arena.clientHeight);
      ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      draw();
    }

    const size = new ResizeObserver(resize);
    size.observe(arena);
    const view = new IntersectionObserver(entries => { visible = entries[0].isIntersecting; sync(); });
    view.observe(graph);
    motion.addEventListener('click', () => { userPaused = !userPaused; sync(); }, { signal: abort.signal });
    reduced.addEventListener('change', () => { userPaused = reduced.matches; sync(); }, { signal: abort.signal });
    document.addEventListener('visibilitychange', sync, { signal: abort.signal });
    resize();
    setActive(active);
    sync();
    leavePage.push(() => { abort.abort(); size.disconnect(); view.disconnect(); cancelAnimationFrame(frame); });
    return setActive;
  }

  function homePage() {
    const hero = template('home-view');
    if (latest) {
      hero.querySelector('.edition-line').textContent = 'Edisi terbaru · ' + dateLabel(latest.date);
      hero.querySelector('.latest-link').href = articleURL(latest);
    } else {
      hero.querySelector('.edition-line').textContent = 'Menunggu edisi pertama.';
      hero.querySelector('.latest-link').hidden = true;
    }
    const trending = editions.find(edition => edition.trending);
    if (trending) {
      const anchor = hero.querySelector('.trending-link');
      anchor.href = articleURL(trending, 'repository-trending');
      anchor.hidden = false;
    }
    const dates = archive(editions.slice(0, 7));
    if (editions.length > 7) dates.append(link('Lihat seluruh arsip →', route('arsip'), 'more-link'));

    return 'Radar berita harian.';
  }

  function archivePage() {
    const section = archive(editions);
    section.querySelector('.section-head').remove();
    app.append(pageHead('Arsip berita', '', editions.length + ' edisi, diurutkan dari yang terbaru.'), section);
    return 'Arsip berita';
  }

  function aboutPage(edition) {
    app.append(pageHead('Redaksi Horizon GANZ', 'REDAKSI DIGITAL',
      'Enam bot bekerja bersama untuk mengumpulkan sumber, memeriksa berita, dan menerbitkan edisi harian dalam Bahasa Indonesia.'));
    app.append(team(edition?.date));
    if (edition) app.append(link('Baca edisi ' + dateLabel(edition.date) + ' →', articleURL(edition), 'more-link'));
    return 'Redaksi Horizon GANZ';
  }

  function rolePage(role, edition) {
    app.append(pageHead(role.name, 'Tim redaksi AI', role.task));
    const grid = element('div', 'detail-grid');
    const panel = element('section', 'detail-panel');
    panel.append(element('h2', '', edition ? 'Edisi ' + dateLabel(edition.date) : 'Tugas redaksi'));
    panel.append(element('p', 'metric', roleResult(role, edition) || 'Rincian jumlah per bot belum tercatat untuk edisi ini.'));
    if (role.next.length) {
      panel.append(element('p', '', 'Hasil pekerjaan diteruskan ke'));
      const links = element('div', 'controls');
      for (const id of role.next) links.append(roleCard(byId.get(id), edition?.date));
      panel.append(links);
    } else if (edition) {
      panel.append(link('Buka hasil penerbitan →', articleURL(edition), 'primary'));
    }
    const chart = element('div');
    grid.append(panel, chart);
    app.append(grid, link('Lihat seluruh tim →', route('redaksi', edition?.date), 'more-link'));
    network(chart, edition?.date, 'redaksi', role.id);
    return role.name;
  }

  // Urutan mengikuti pipeline Horizon: Penyaring bekerja sebelum dan sesudah Analis.
  function processPage(edition) {
    const steps = [
      ['pemantau', 'Mengumpulkan berita dari sumber.'],
      ['penyaring', 'Menggabungkan entri yang mengarah ke berita sama.'],
      ['analis', 'Menilai relevansi dan isi berita.'],
      ['penyaring', 'Memilih berita untuk edisi ini.'],
      ['penulis', 'Menyiapkan draf Bahasa Indonesia.'],
      ['editor', 'Mencocokkan klaim draf dengan sumber.']
    ];
    if (edition?.stats.revised > 0) {
      steps.push(['penulis', 'Merevisi draf sesuai catatan Editor.'], ['editor', 'Memeriksa kembali hasil revisi.']);
    }
    steps.push(['penerbit', 'Menerbitkan edisi dan memperbarui arsip.']);
    app.append(pageHead('Putar ulang proses', 'Tim redaksi AI', edition ? 'Edisi ' + dateLabel(edition.date) : 'Alur kerja redaksi'));
    const grid = element('div', 'detail-grid');
    const panel = element('section', 'detail-panel');
    const stepNo = element('p', 'role-label');
    const current = element('h2');
    const desc = element('p', 'step-text');
    const result = element('p', 'metric');
    const controls = element('div', 'controls');
    const play = element('button', 'control');
    const next = element('button', 'control', 'Tahap berikutnya');
    const details = link('', '#', 'more-link');
    controls.append(play, next);
    panel.append(stepNo, current, desc, result, controls, details);
    const chart = element('div');
    grid.append(panel, chart);
    const strip = element('ol', 'step-list');
    const badges = steps.map(([id]) => {
      const badge = element('li', '', byId.get(id).name);
      badge.style.setProperty('--tint', byId.get(id).color);
      return badge;
    });
    strip.append(...badges);
    app.append(grid, strip);
    const light = network(chart, edition?.date);
    let index = 0, timer = null, playing = !reduced.matches && !document.hidden;
    function renderStep() {
      clearTimeout(timer);
      const [id, note] = steps[index];
      const role = byId.get(id);
      const last = index === steps.length - 1;
      if (last) playing = false;
      stepNo.textContent = 'Tahap ' + (index + 1) + ' dari ' + steps.length;
      current.textContent = role.name;
      desc.textContent = note;
      result.textContent = roleResult(role, edition);
      result.hidden = !result.textContent;
      details.textContent = 'Tugas ' + role.name + ' →';
      details.href = route('bot/' + id, edition?.date);
      play.textContent = last ? 'Ulang dari awal' : playing ? 'Jeda' : 'Putar';
      next.disabled = last;
      badges.forEach((badge, i) => {
        if (i === index) badge.setAttribute('aria-current', 'step');
        else badge.removeAttribute('aria-current');
      });
      light(id);
      if (playing) timer = setTimeout(() => { index++; renderStep(); }, 2600);
    }
    play.addEventListener('click', () => {
      if (index === steps.length - 1) index = 0;
      playing = !playing;
      renderStep();
    });
    next.addEventListener('click', () => { playing = false; index++; renderStep(); });
    function pauseHidden() {
      if (document.hidden || reduced.matches) { playing = false; renderStep(); }
    }
    document.addEventListener('visibilitychange', pauseHidden);
    reduced.addEventListener('change', pauseHidden);
    leavePage.push(() => {
      clearTimeout(timer);
      document.removeEventListener('visibilitychange', pauseHidden);
      reduced.removeEventListener('change', pauseHidden);
    });
    renderStep();
    return 'Putar ulang proses';
  }

  function addTopics(reader, hrefFor) {
    const headings = [...reader.querySelectorAll('.story h2[id]')];
    if (!headings.length) return;
    const nav = element('nav', 'topic-nav');
    nav.setAttribute('aria-label', 'Pilih topik');
    nav.append(element('strong', '', 'Pilih topik'));
    headings.forEach(heading => nav.append(link(heading.textContent, hrefFor(heading.id))));
    reader.prepend(nav);
  }

  // Pratinjau HP menyimpan artikel dalam template lokal. Di GitHub Pages artikel memakai URL Jekyll asli.
  function snapshotPage(edition) {
    const source = document.getElementById('edisi-' + edition.date);
    if (!source) return missingPage();
    const title = 'Edisi ' + dateLabel(edition.date);
    const reader = element('article', 'reader');
    const story = element('div', 'story');
    story.append(source.content.cloneNode(true));
    const anchorFor = id => articleURL(edition, id);
    for (const anchor of story.querySelectorAll('a[href^="#"]')) {
      anchor.href = anchorFor(anchor.getAttribute('href').slice(1));
    }
    reader.append(story);
    addTopics(reader, anchorFor);
    app.append(pageHead(title, 'Edisi harian'), reader, team(edition.date));
    return title;
  }

  function missingPage() {
    app.append(pageHead('Halaman tidak ditemukan', '', 'Pilih tanggal yang tersedia di arsip berita.'),
      link('Buka arsip berita →', route('arsip'), 'primary'));
    return 'Halaman tidak ditemukan';
  }

  function navState(homeView, about, inArchive) {
    document.querySelector('.nav-home').hidden = homeView;
    const brand = document.querySelector('.brand');
    brand.href = about ? route() : route('redaksi');
    brand.setAttribute('aria-label', 'HORIZON GANZ — ' + (about ? 'beranda' : 'profil redaksi'));
    const archiveLink = document.querySelector('.nav-archive');
    if (inArchive) archiveLink.setAttribute('aria-current', 'page');
    else archiveLink.removeAttribute('aria-current');
  }

  function render(focus = false) {
    if (location.hash === '#utama') { app.focus(); return; }
    const parts = location.hash.replace(/^#\/?/, '').split('/');
    const [view, key, third, extra] = parts;
    const date = view === 'bot' ? third : key;
    const edition = date ? editions.find(item => item.date === date) : latest;
    resetPage();
    navState(!view, view === 'redaksi', view === 'arsip');
    let title;
    if (!view) title = homePage();
    else if (view === 'arsip') title = archivePage();
    else if (view === 'redaksi' && (!date || edition)) title = aboutPage(edition);
    else if (view === 'bot' && byId.has(key) && (!date || edition)) title = rolePage(byId.get(key), edition);
    else if (view === 'proses' && (!date || edition)) title = processPage(edition);
    else if (offline && view === 'edisi' && edition && !extra) title = snapshotPage(edition);
    else title = missingPage();
    document.title = title + ' · HORIZON GANZ';
    if (focus) app.focus({ preventScroll: true });
    window.scrollTo(0, 0);
    if (offline && view === 'edisi' && third) {
      let id;
      try { id = decodeURIComponent(third); } catch { return; }
      document.getElementById(id)?.scrollIntoView();
    }
  }

  if (dashboard) {
    // Route hash bekerja saat file HTML dibuka langsung, termasuk tombol Kembali pada HP.
    window.addEventListener('hashchange', () => render(true));
    render();
  } else {
    navState(false, false, false);
    const reader = document.querySelector('.reader[data-reader-date]');
    if (reader) addTopics(reader, id => '#' + encodeURIComponent(id));
    const slot = document.querySelector('[data-edition-team]');
    if (slot) slot.replaceChildren(team(slot.dataset.date));
  }
})();

</script>
</body>
</html>
