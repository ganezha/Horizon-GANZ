name: Deploy Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'skills/horizon/**', 'LICENSE', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:

concurrency:
  group: horizon-publication
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Package Horizon skill
        run: |
          mkdir -p docs/downloads
          git archive --format=zip --prefix=horizon/ --add-file=LICENSE \
            --output=docs/downloads/horizon-skill.zip HEAD:skills/horizon

      - name: Read published editions
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published
          persist-credentials: false

      - name: Translate remaining archive editions into Indonesian
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/indonesian_archive.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
